name: AIKit Integration Test

on:
  workflow_dispatch:
    inputs:
      aikit_image:
        description: 'AIKit container image to test'
        required: false
        default: 'ghcr.io/kaito-project/aikit/llama3.2:1b'
        type: string
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  KIND_VERSION: "0.31.0"
  KUBECTL_VERSION: "1.33.0"
  AIKIT_IMAGE: ${{ github.event.inputs.aikit_image || 'ghcr.io/kaito-project/aikit/llama3.2:1b' }}
  KAITO_NAMESPACE: "kaito-system"

jobs:
  aikit-integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install kind
        run: |
          curl -Lo ./kind "https://github.com/kubernetes-sigs/kind/releases/download/v${{ env.KIND_VERSION }}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Create kind cluster
        run: |
          cat << EOF > kind-config.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          name: kaito
          nodes:
          - role: control-plane
            kubeadmConfigPatches:
            - |
              kind: InitConfiguration
              nodeRegistration:
                kubeletExtraArgs:
                  node-labels: "apps=aikit-test"
          EOF
          kind create cluster --config kind-config.yaml
          kubectl cluster-info

      - name: Build workspace controller
        run: |
          # Use the docker-build-workspace target with local configuration
          make docker-build-workspace ARCH=amd64

          # Load into kind cluster
          kind load docker-image local/workspace:test --name kaito
        env:
          REGISTRY: "local"
          IMG_NAME: "workspace"
          IMG_TAG: "test"
          OUTPUT_TYPE: "type=docker"

      - name: Deploy KAITO workspace controller
        run: |
          # Update the Helm values with our local image
          yq -i '(.image.repository) = "local/workspace"' ./charts/kaito/workspace/values.yaml
          yq -i '(.image.tag) = "test"' ./charts/kaito/workspace/values.yaml

          kubectl create namespace ${{ env.KAITO_NAMESPACE }}

          # Install via Helm
          # CSI Local Node cannot be configured to not deploy and it crashes on kind on github runners for unknown reasons
          # so we need to filter it out its components
          helm template kaito-workspace ./charts/kaito/workspace --namespace ${{ env.KAITO_NAMESPACE }} --set nodeProvisioner="byo" --set featureGates.enableInferenceSetController="true" --set featureGates.gatewayAPIInferenceExtension="true" --include-crds --debug --wait | awk '
            BEGIN { RS="---\n"; ORS="---\n"; csi=0 }
            /kind: ServiceAccount/ && /name: csi-local-node/ { csi=1 }
            /kind: StorageClass/ && /name: kaito-local-nvme-disk/ { csi=1 }
            /kind: ClusterRole/ && /name: csi-local-node-role/ { csi=1 }
            /kind: ClusterRoleBinding/ && /name: csi-local-node-binding/ { csi=1 }
            /kind: DaemonSet/ && /name: csi-local-node/ { csi=1 }
            !csi { print }
            { csi=0 }
          ' | kubectl apply --namespace ${{ env.KAITO_NAMESPACE }} -f -

          # Wait for controller to be ready
          kubectl wait --for=condition=available --timeout=300s deployment/kaito-workspace -n ${{ env.KAITO_NAMESPACE }}

      - name: Deploy keda-operator
        run: |
          helm repo add kedacore https://kedacore.github.io/charts
          helm install keda kedacore/keda --namespace keda --create-namespace
          kubectl wait --for=condition=available --timeout=300s deployment/keda-operator -n keda

      - name: Deploy KEDA Kaito Scaler
        run: |
          helm repo add keda-kaito-scaler https://kaito-project.github.io/keda-kaito-scaler/charts/kaito-project
          helm repo update
          # keda-kaito-scaler must be in the same namespace as KEDA (shares TLS secrets)
          # Install the latest chart version so we always pick up the current
          # annotation-driven auto-provision schema shipped by keda-kaito-scaler
          # (see kaito-project/keda-kaito-scaler#129, which introduced the
          # single YAML-list `scaledobject.kaito.sh/metrics` annotation used by
          # the InferenceSet fixture below).
          helm upgrade --install keda-kaito-scaler -n keda keda-kaito-scaler/keda-kaito-scaler
          kubectl wait --for=condition=available --timeout=300s deployment/keda-kaito-scaler -n keda

          # Wait for keda-kaito-scaler TLS certs to be fully provisioned before
          # KEDA attempts its first gRPC connection (avoids pool poisoning).
          echo "Waiting for keda-kaito-scaler TLS certs..."
          for i in $(seq 1 30); do
            if kubectl get secret keda-kaito-scaler-server-certs -n keda -o jsonpath='{.data.ca\.crt}' 2>/dev/null | grep -q .; then
              echo "✓ TLS certs ready"
              break
            fi
            sleep 2
          done

          # Restart KEDA operator to pick up certs with a clean gRPC pool
          kubectl -n keda rollout restart deploy/keda-operator
          kubectl -n keda rollout status deploy/keda-operator --timeout=120s

      - name: Create AIKit workspace
        run: |
          cat << EOF > aikit-workspace.yaml
          apiVersion: kaito.sh/v1beta1
          kind: Workspace
          metadata:
            name: workspace-aikit-test
          resource:
            labelSelector:
              matchLabels:
                apps: aikit-test
          inference:
            template:
              spec:
                containers:
                  - name: aikit-llama
                    image: ${{ env.AIKIT_IMAGE }}
                    args:
                      - "run"
                      - "--address=:5000"
          EOF
          kubectl apply -f aikit-workspace.yaml

      - name: Create AIKit InferenceSet
        run: |
          cat << EOF > aikit-inferenceset.yaml
          apiVersion: kaito.sh/v1alpha1
          kind: InferenceSet
          metadata:
            name: inferenceset-aikit-test
            annotations:
              # Annotation-driven auto-provision. The earlier v0.6.0 indexed
              # keys (metricName/0, upthreshold/0, ...) were invalid Kubernetes
              # annotation keys and were replaced in
              # kaito-project/keda-kaito-scaler#129 with a single YAML-list
              # `scaledobject.kaito.sh/metrics` annotation used below.
              scaledobject.kaito.sh/auto-provision: "true"
              scaledobject.kaito.sh/max-replicas: "5"
              # One entry per metric. AIKit does not emit vLLM metrics, so
              # this trigger will never fire in the test — the goal is only
              # to validate that the ScaledObject / HPA are created and
              # reconciled correctly.
              scaledobject.kaito.sh/metrics: |
                - name: vllm:num_requests_waiting
                  type: gauge
                  upthreshold: 10
                  downthreshold: 1
          spec:
            labelSelector:
              matchLabels:
                apps: aikit-test
            replicas: 1
            template:
              inference:
                template:
                  spec:
                    containers:
                      - name: aikit-llama
                        image: ${{ env.AIKIT_IMAGE }}
                        args:
                          - "run"
                          - "--address=:5000"
          EOF
          kubectl apply -f aikit-inferenceset.yaml

      - name: Wait for inference to be ready
        run: |
          echo "Waiting for inference to be ready..."
          kubectl wait --for='jsonpath={.status.conditions[?(@.type=="InferenceReady")].status}=True' workspace/workspace-aikit-test --timeout 300s

      - name: Wait for inferenceset to be ready
        run: |
          echo "Waiting for inferenceset to be ready..."
          kubectl wait --for='jsonpath={.status.readyReplicas}=1' inferenceset/inferenceset-aikit-test --timeout 300s

      - name: Validate response content
        run: |
          # Set up port forwarding to the workspace service
          echo "Setting up port forwarding..."
          kubectl port-forward service/workspace-aikit-test 8080:80 &
          PORT_FORWARD_PID=$!

          # Wait for port-forward to be ready
          sleep 5

          # Test that we get expected model information
          echo 'Validating model response contains expected data...'
          MODELS_RESPONSE=$(curl -s http://localhost:8080/v1/models)
          echo "Models response: $MODELS_RESPONSE"

          # Extract the first model name from the response
          MODEL_NAME=$(echo "$MODELS_RESPONSE" | jq -r '.data[0].id')
          echo "Extracted model name: $MODEL_NAME"

          # Check if response contains 'llama'
          if echo "$MODELS_RESPONSE" | grep -i 'llama'; then
            echo 'Model response validation passed!'
          else
            echo 'Model response validation failed - no llama model found'
            kill $PORT_FORWARD_PID
            exit 1
          fi

          echo 'Testing completion response...'
          COMPLETION_RESPONSE=$(curl -s -X POST \
            -H 'Content-Type: application/json' \
            -d "{
              \"model\": \"$MODEL_NAME\",
              \"messages\": [{\"role\": \"user\", \"content\": \"hello\"}]
            }" \
            http://localhost:8080/v1/chat/completions)
          echo "Completion response: $COMPLETION_RESPONSE"

          # Check if we get some response with expected fields
          if echo "$COMPLETION_RESPONSE" | jq -e '(type=="object" and has("choices") and has("usage"))'; then
            echo 'Completion response validation passed!'
          else
            echo 'Completion response validation failed - missing expected fields'
            kill $PORT_FORWARD_PID
            exit 1
          fi

          # Clean up port forwarding
          kill $PORT_FORWARD_PID
          echo 'Validation completed successfully!'

      - name: Check ScaledObject and hpa created
        run: |
          echo "Checking for ScaledObject..."
          kubectl describe scaledobject inferenceset-aikit-test

          echo "Checking for HorizontalPodAutoscaler..."
          kubectl describe hpa keda-hpa-inferenceset-aikit-test

      - name: Debug info
        if: always()
        run: |
          echo "=== InferenceSet Status ==="
          kubectl get inferenceset inferenceset-aikit-test -o yaml || true

          echo "=== ScaledObject Status ==="
          kubectl get scaledobject -A || true

          echo "=== HPA Status ==="
          kubectl get hpa -A || true

          echo "=== Workspace Status ==="
          kubectl get workspace workspace-aikit-test -o yaml || true

          echo "=== Workspace events ==="
          kubectl describe workspace workspace-aikit-test || true

          echo "=== Pods ==="
          kubectl get pods -A -o wide || true

          echo "=== Services ==="
          kubectl get services workspace-aikit-test -o yaml || true

          echo "=== Pod events ==="
          kubectl describe pods -l kaito.sh/workspace=workspace-aikit-test || true

          echo "=== Inference Pod Logs ==="
          kubectl logs -l kaito.sh/workspace=workspace-aikit-test --tail=-1 || true

          echo "=== Controller logs ==="
          kubectl logs -l app.kubernetes.io/name=workspace -n ${{ env.KAITO_NAMESPACE }} --tail=-1 || true

          echo "=== Controller previous logs (if restarted) ==="
          for pod in $(kubectl get pods -l app.kubernetes.io/name=workspace -n ${{ env.KAITO_NAMESPACE }} -o jsonpath='{.items[*].metadata.name}'); do
            restarts=$(kubectl get pod "$pod" -n ${{ env.KAITO_NAMESPACE }} -o jsonpath='{.status.containerStatuses[0].restartCount}')
            if [ "$restarts" -gt 0 ] 2>/dev/null; then
              echo "--- Previous logs for $pod (restarts: $restarts) ---"
              kubectl logs -n ${{ env.KAITO_NAMESPACE }} "$pod" -p || true
            fi
          done

          echo "=== Node information ==="
          kubectl describe nodes
