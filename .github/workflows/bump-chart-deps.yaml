name: Bump Helm chart dependencies

# Daily check of every subchart dependency declared in charts/kaito/*/Chart.yaml
# (e.g. productionstack, flux2, gpu-feature-discovery, local-csi-driver). For each
# dependency with a newer stable release, opens (or refreshes) one PR that bumps
# Chart.yaml, Chart.lock, and the vendored tarball. See hack/bump-chart-deps.sh.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.deps.outputs.matrix }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # tag=v6.0.1
        with:
          persist-credentials: false

      - name: List chart dependencies
        id: deps
        run: |
          matrix="$(for f in charts/kaito/*/Chart.yaml; do
            CHART="$(dirname "${f}")" CHART_NAME="$(basename "$(dirname "${f}")")" yq -o=json -I=0 \
              '[.dependencies[]?.name | {"chart": strenv(CHART), "chart_name": strenv(CHART_NAME), "dependency": .}]' "${f}"
          done | jq -c -s 'add // []')"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "${matrix}"

  bump:
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # tag=v6.0.1
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.21.1

      - name: Bump ${{ matrix.dependency }}
        id: bump
        env:
          CHART_DIR: ${{ matrix.chart }}
          DEPENDENCY: ${{ matrix.dependency }}
        run: ./hack/bump-chart-deps.sh "${CHART_DIR}" "${DEPENDENCY}"

      - name: Create pull request
        if: steps.bump.outputs.new_version != ''
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ github.token }}
          # The all-branches repo ruleset only allows GITHUB_TOKEN to create branches matching automation/**.
          branch: automation/bump-${{ matrix.chart_name }}-${{ matrix.dependency }}
          add-paths: ${{ matrix.chart }}
          signoff: true
          sign-commits: true
          delete-branch: true
          commit-message: "chore: bump ${{ matrix.dependency }} chart to ${{ steps.bump.outputs.new_version }} in ${{ matrix.chart }}"
          title: "chore: bump ${{ matrix.dependency }} chart to ${{ steps.bump.outputs.new_version }} in ${{ matrix.chart }}"
          body: |
            **Reason for Change**:
            Automated bump of the `${{ matrix.dependency }}` subchart in `${{ matrix.chart }}` from `${{ steps.bump.outputs.old_version }}` to `${{ steps.bump.outputs.new_version }}`.

            Generated by the [Bump Helm chart dependencies](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow via `hack/bump-chart-deps.sh`.

            **Requirements**

            - [ ] added unit tests and e2e tests (if applicable).

            **Issue Fixed**:

            **Notes for Reviewers**:
            Review the upstream release notes for `${{ matrix.dependency }}` for breaking changes or new values keys before merging.
