# TEMPORARY workflow (branch: qzhuang/tmp-mcr-extension).
# All build / chart-pinning / push logic is bypassed. This job only registers
# an extension version pointing at a pre-published helm chart in MCR.
# Revert before merging back to main.
name: Publish nightly controller ACR images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Extension version to register (SemVer, e.g. 0.12.0-rc-20260812)'
        required: true
        default: '0.12.0-rc-20260812'
      chart_path:
        description: 'fullPathToHelmChart (registry + repo, no tag)'
        required: true
        default: 'mcr.microsoft.com/aks/kaito/helm/workspace'

permissions:
  contents: read

jobs:
  publish-extension:
    runs-on:
      labels:
        - self-hosted
        - hostname:kaito-e2e-github-runner
    environment: publish-mcr
    steps:
      - name: Publish Extension
        env:
          IDENTITY_CLIENT_ID: ${{ secrets.IDENTITY_CLIENT_ID }}
          EXTENSIONS_DP_RESOURCE: ${{ secrets.EXTENSIONS_DP_RESOURCE }}
          EXTENSIONS_DP_ENDPOINT: ${{ secrets.EXTENSIONS_DP_ENDPOINT }}
          EXTENSIONS_API_VERSION: ${{ secrets.EXTENSIONS_API_VERSION }}
          KAITO_EXTENSION_SUBSCRIPTION: ${{ secrets.KAITO_EXTENSION_SUBSCRIPTION }}
          KAITO_EXTENSION_TYPE: ${{ secrets.KAITO_EXTENSION_TYPE }}
          KAITO_EXTENSION_VERSION: ${{ github.event.inputs.version }}
          KAITO_EXTENSION_CHART_PATH: ${{ github.event.inputs.chart_path }}
        run: |
          az login --identity --client-id "${IDENTITY_CLIENT_ID}"
          az rest --resource "${EXTENSIONS_DP_RESOURCE}" --method 'PUT' --url "https://${EXTENSIONS_DP_ENDPOINT}/subscriptions/${KAITO_EXTENSION_SUBSCRIPTION}/extensionTypeRegistrations/${KAITO_EXTENSION_TYPE}/versions/${KAITO_EXTENSION_VERSION}?api-version=${EXTENSIONS_API_VERSION}" --body '{
              "artifactEndpoints": [
                  {
                      "regions": [
                          "eastus2euap",
                          "centraluseuap",
                          "westcentralus",
                          "eastasia",
                          "uksouth",
                          "eastus",
