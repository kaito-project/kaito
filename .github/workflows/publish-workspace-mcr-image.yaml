# TEMPORARY workflow (branch: qzhuang/tmp-mcr-extension).
# Composes the ACR nightly flow with the MCR release:
#   - build & push workspace image to ACR (matches nightly)
#   - pin Chart.yaml/values.yaml, embed productionstack subchart
#   - push helm chart to MCR
#   - register extension version (fullPathToHelmChart -> MCR/helm/workspace)
# Manual trigger only; revert this file before merging back to main.
name: Publish KAITO MCR image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extension/chart version (SemVer, e.g. 0.12.0-rc-20260812)'
        required: true
        default: '0.12.0-rc-20260812'
      git_ref:
        description: 'Git ref to build from (branch, tag, or SHA)'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

env:
  GO_VERSION: '1.26.4'
  IMAGE_NAME: 'workspace'
  CHART_PATH: 'charts/kaito/workspace'

jobs:
  build-publish-mcr-image:
    runs-on:
      labels:
        - self-hosted
        - 1ES.Pool=1es-aks-kaito-agent-pool-ubuntu
        - JobId=buildPublishMcrImage-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}
    environment: publish-mcr
    steps:
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.19.4'

      - name: Install ORAS
        run: |
          VER='1.3.0'
          curl -LO "https://github.com/oras-project/oras/releases/download/v${VER}/oras_${VER}_linux_amd64.tar.gz"
          sudo tar -zxf "./oras_${VER}_linux_amd64.tar.gz" -C '/usr/local/bin'
          rm -f "./oras_${VER}_linux_amd64.tar.gz"

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - id: get-image-tag
        name: Compute image tag
        run: |
          ver='${{ github.event.inputs.tag }}'
          echo "img_tag=${ver#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          submodules: true
          ref: ${{ github.event.inputs.git_ref || 'main' }}

      - name: Authenticate to ACR and MCR
        run: |
          # 1ES pool uses a system-assigned MI; --client-id would look up a user-assigned identity that doesn't exist here.
          az login --identity
          az acr login -n "${ACR_REGISTRY}"
          az acr login -n "${MCR_REGISTRY}"
        env:
          ACR_REGISTRY: ${{ secrets.KAITO_ACR_REGISTRY }}
          MCR_REGISTRY: ${{ secrets.KAITO_MCR_REGISTRY }}

      - name: Build and push workspace image to ACR
        run: |
          make docker-build-workspace \
            REGISTRY="${REGISTRY}" \
            IMG_TAG="${IMG_TAG}" \
            IMG_NAME="${IMAGE_NAME}"
        env:
          REGISTRY: ${{ secrets.KAITO_ACR_REGISTRY }}
          IMG_TAG: ${{ steps.get-image-tag.outputs.img_tag }}

      - name: Pin chart version and image to release tag
        run: |
          # Chart.yaml: align version/appVersion with IMG_TAG so helm package emits
          # <name>-<IMG_TAG>.tgz, which is what the Makefile target expects.
          yq -i ".version = \"${IMG_TAG}\" | .appVersion = \"${IMG_TAG}\"" "${CHART_PATH}/Chart.yaml"
          # values.yaml: point the controller image at the ACR registry+tag we just pushed.
          yq -i ".image.repository = \"${REGISTRY}/${IMAGE_NAME}\" | .image.tag = \"${IMG_TAG}\"" "${CHART_PATH}/values.yaml"
        env:
          REGISTRY: ${{ secrets.KAITO_ACR_REGISTRY }}
          IMG_TAG: ${{ steps.get-image-tag.outputs.img_tag }}

      - name: Pin productionstack subchart to latest ACR tag
        run: |
          registry_name="${REGISTRY%%.*}"
          productionstack_tag="$(az acr repository show-tags \
            --name "${registry_name}" \
            --repository 'helm/productionstack' \
            --orderby time_desc \
            --top 1 \
            --output tsv)"
          if [[ -z "${productionstack_tag}" ]]; then
            echo 'No productionstack tags found in ACR' >&2
            exit 1
          fi

          export PRODUCTIONSTACK_REPOSITORY="oci://${REGISTRY}/helm"
          export PRODUCTIONSTACK_TAG="${productionstack_tag}"
          yq -i '(.dependencies[] | select(.name == "productionstack") | .repository) = strenv(PRODUCTIONSTACK_REPOSITORY) |
            (.dependencies[] | select(.name == "productionstack") | .version) = strenv(PRODUCTIONSTACK_TAG)' "${CHART_PATH}/Chart.yaml"
          # helm dependency update pulls productionstack into charts/ so the packaged
          # tgz embeds it — consumers installing from MCR do not need ACR access.
          helm dependency update "${CHART_PATH}"
        env:
          REGISTRY: ${{ secrets.KAITO_ACR_REGISTRY }}

      - name: Package and push workspace chart to MCR
        run: |
          make helm-package-workspace \
            REGISTRY="${MCR_REGISTRY}/helm" \
            IMG_TAG="${IMG_TAG}" \
            IMG_NAME="${IMAGE_NAME}"
        env:
          MCR_REGISTRY: ${{ secrets.KAITO_MCR_REGISTRY }}
          IMG_TAG: ${{ steps.get-image-tag.outputs.img_tag }}

      - name: Publish Extension
        env:
          EXTENSIONS_DP_RESOURCE: ${{ secrets.EXTENSIONS_DP_RESOURCE }}
          EXTENSIONS_DP_ENDPOINT: ${{ secrets.EXTENSIONS_DP_ENDPOINT }}
          EXTENSIONS_API_VERSION: ${{ secrets.EXTENSIONS_API_VERSION }}
          KAITO_EXTENSION_SUBSCRIPTION: ${{ secrets.KAITO_EXTENSION_SUBSCRIPTION }}
          KAITO_EXTENSION_TYPE: ${{ secrets.KAITO_EXTENSION_TYPE }}
          KAITO_EXTENSION_VERSION: ${{ steps.get-image-tag.outputs.img_tag }}
          KAITO_EXTENSION_REGISTRY: ${{ secrets.KAITO_MCR_REGISTRY }}
        run: |
          az login --identity
          az rest --resource "${EXTENSIONS_DP_RESOURCE}" --method 'PUT' --url "https://${EXTENSIONS_DP_ENDPOINT}/subscriptions/${KAITO_EXTENSION_SUBSCRIPTION}/extensionTypeRegistrations/${KAITO_EXTENSION_TYPE}/versions/${KAITO_EXTENSION_VERSION}?api-version=${EXTENSIONS_API_VERSION}" --body '{
              "artifactEndpoints": [
                  {
                      "regions": [
                          "eastus2euap",
                          "centraluseuap",
                          "westcentralus",
                          "eastasia",
                          "uksouth",
                          "eastus",
                          "australiaeast",
