action: redact
blockMessage: "The model output was blocked by output guardrails."
scanners:
  - type: ban_substrings
    action: block
    substrings:
      - SECRET_PROJECT
      - INTERNAL_ONLY
      - CLASSIFIED_DATA
      - TOP_SECRET
    match_type: word
    case_sensitive: false
  - type: ban_substrings
    action: redact
    substrings:
      - CONFIDENTIAL
      - PROPRIETARY
      - RESTRICTED
    match_type: word
    case_sensitive: false
  - type: sensitive
    action: redact
    detectors:
      - email
      - phone
      - credit_card
      - ip_address
  - type: invisible_text
    action: block
