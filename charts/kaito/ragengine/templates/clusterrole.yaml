---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kaito.fullname" . }}-clusterrole
  labels:
    {{- include "kaito.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kaito.sh"]
    resources: ["ragengines"]
    verbs: ["update", "patch","get","list","watch"]
  - apiGroups: ["kaito.sh"]
    resources: ["ragengines/status"]
    verbs: ["update", "patch","get","list","watch"]
  # Children of a RAGEngine carry a blockOwnerDeletion owner reference. The
  # OwnerReferencesPermissionEnforcement admission plugin (on by default in OpenShift)
  # only allows that for a subject holding update on the owner's finalizers subresource.
  - apiGroups: ["kaito.sh"]
    resources: ["ragengines/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["nodes", "namespaces"]
    verbs: ["get","list","watch","update", "patch"]
  # The webhook reconciler makes the release namespace the owner of the
  # ValidatingWebhookConfiguration, with blockOwnerDeletion set.
  - apiGroups: [""]
    resources: ["namespaces/finalizers"]
    verbs: ["update"]
    resourceNames: ["{{ .Release.Namespace }}"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get","list","watch","create", "delete", "update", "patch"]
  - apiGroups: [ "" ]
    resources: [ "pods"]
    verbs: ["get","list","watch","create", "update", "patch" ]
  - apiGroups: [ "" ]
    resources: [ "configmaps" ]
    verbs: [ "get","list","watch","create", "delete" ]
  - apiGroups: [ "apps" ]
    resources: ["deployments" ]
    verbs: ["get","list","watch","create", "delete","update", "patch"]
  - apiGroups: [ "apps" ]
    resources: ["controllerrevisions" ]
    verbs: [ "get","list","watch","create", "delete","update", "patch"]
  - apiGroups: ["karpenter.sh"]
    resources: ["machines", "machines/status", "nodeclaims", "nodeclaims/status"]
    verbs: ["get","list","watch","create", "delete", "update", "patch"]
  - apiGroups: [ "karpenter.azure.com" ]
    resources: [ "aksnodeclasses"]
    verbs: [ "get","list","watch","create", "delete", "update", "patch" ]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["get","list","watch"]
  # delete is never called: OwnerReferencesPermissionEnforcement only lets a subject that
  # can delete an object change its owner references.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["update", "delete"]
    resourceNames: ["validation.ragengine.kaito.sh"]
