apiVersion: v1
kind: ConfigMap
metadata:
  name: kaito-base-images
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "utils.toYamlStrMap" .Values.commonLabels | nindent 4 }}
data:
  BaseImages: |
    images:
      - name: base
        tag: 0.7.0
        runtimeVersion:
          vllm: 0.32.0
          transformers: 5.19.0
      - name: base-cpu
        tag: 0.0.3
        runtimeVersion:
          vllm: 0.32.0
