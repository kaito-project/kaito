{{- if .Values.featureGates.ModelMirror -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kaito.fullname" . }}-modelmirror-clusterrole
  labels:
    {{- include "kaito.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kaito.sh"]
    resources: ["modelmirrors"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kaito.sh"]
    resources: ["modelmirrors/status"]
    verbs: ["get", "update", "patch"]
  # SetControllerReference stamps blockOwnerDeletion on the PVC and Job it owns, which the
  # OwnerReferencesPermissionEnforcement admission plugin only allows for a subject holding
  # update on the owner's finalizers subresource. Unrelated to finalizers on the CR itself.
  - apiGroups: ["kaito.sh"]
    resources: ["modelmirrors/finalizers"]
    verbs: ["update"]
  # The PVC is garbage collected via its ownerReference; update is what removes the
  # protection finalizer so that deletion can complete.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "update", "patch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["update"]
    resourceNames: ["validation.modelmirror.kaito.sh"]
{{- end -}}
