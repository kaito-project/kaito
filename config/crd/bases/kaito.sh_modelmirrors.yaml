---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: modelmirrors.kaito.sh
spec:
  group: kaito.sh
  names:
    kind: ModelMirror
    listKind: ModelMirrorList
    plural: modelmirrors
    singular: modelmirror
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source.modelID
      name: Model
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ModelMirror represents a cached copy of a model from a remote registry. The PVC and
          download Job are created in the ModelMirror's own namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              mode:
                default: Managed
                description: |-
                  Mode selects how the model weights are made available:
                    - "Managed" (default): the controller downloads the model to a PVC via a download Job.
                    - "Static": the model weights already exist in a pre-existing (BYO) storage location;
                      the controller creates no PVC and no download Job, and the weights location is
                      reported in status.modelPath.
                enum:
                - Managed
                - Static
                type: string
              serviceAccountName:
                description: |-
                  ServiceAccountName is the ServiceAccount used by the workload identity that the download
                  Job pod runs as. It is resolved in the ModelMirror's namespace. Empty (the default) runs
                  the Job under the namespace default ServiceAccount.
                type: string
              source:
                description: |-
                  Source describes where to download the model weights from. Required for a Managed
                  mirror; omit entirely for a Static mirror.
                properties:
                  accessSecretName:
                    description: |-
                      AccessSecretName is the name of a secret in the ModelMirror's namespace holding the
                      registry credentials under the HF_TOKEN key.
                    type: string
                  modelID:
                    description: ModelID is the model identifier (e.g. "Qwen/Qwen2.5-Coder-32B-Instruct").
                    type: string
                  registry:
                    description: Registry is the source registry to download the model
                      weights from.
                    enum:
                    - huggingface
                    type: string
                required:
                - modelID
                - registry
                type: object
              storage:
                description: |-
                  Storage describes the PVC to download the model weights into. Required for a Managed
                  mirror; omit entirely for a Static mirror.
                properties:
                  size:
                    description: Size is the PVC size for managed mirrors.
                    type: string
                  storageClassName:
                    description: StorageClassName is the StorageClass to use for the
                      PVC.
                    type: string
                required:
                - size
                type: object
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              download:
                description: |-
                  Download reports in-progress download metrics. Both fields are 0 once the
                  download has succeeded, since they describe only the in-progress state.
                  On terminal failure they retain their last observed values; the failure
                  itself is reported through the Ready condition.
                properties:
                  remainingSeconds:
                    description: |-
                      RemainingSeconds estimates the time to completion. 0 once the download has
                      finished; -1 when it cannot be computed, which happens when the total size
                      is unknown or the measured speed is 0.
                    format: int64
                    type: integer
                  speedBytesPerSecond:
                    description: |-
                      SpeedBytesPerSecond is the average download speed from the start of the
                      download until now. 0 once the download has finished.
                    format: int64
                    type: integer
                required:
                - remainingSeconds
                - speedBytesPerSecond
                type: object
              failureMessage:
                type: string
              lastDownloadTime:
                format: date-time
                type: string
              modelPath:
                type: string
              phase:
                enum:
                - Pending
                - Ready
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
