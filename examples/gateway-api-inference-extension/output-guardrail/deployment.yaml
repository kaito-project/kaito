---
apiVersion: v1
kind: Service
metadata:
  name: llm-guard-ext-proc
  namespace: default
spec:
  selector:
    app: llm-guard-ext-proc
  ports:
  - name: grpc
    port: 9000
    targetPort: 9000
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-guard-ext-proc
  namespace: default
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: llm-guard-ext-proc
  template:
    metadata:
      labels:
        app: llm-guard-ext-proc
    spec:
      containers:
      - name: ext-proc
        image: your-registry/llm-guard-ext-proc:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9000
          name: grpc
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          grpc:
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          grpc:
            port: 9000
          initialDelaySeconds: 3
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
