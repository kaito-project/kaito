apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: llm-guard-gateway
  namespace: default
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: mock-llm-vs
  namespace: default
spec:
  hosts:
  - "*"
  gateways:
  - llm-guard-gateway
  http:
  - match:
    - uri:
        prefix: /v1/chat/completions
    route:
    - destination:
        host: mock-llm.default.svc.cluster.local
        port:
          number: 80
