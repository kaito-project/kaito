# Requires the workspace manager to enable the enableCPUInference feature gate.
apiVersion: kaito.sh/v1beta1
kind: InferenceSet
metadata:
  name: gemma-4-e4b-it-cpu-tfs
  annotations:
    kaito.sh/runtime: transformers
spec:
  replicas: 1
  labelSelector:
