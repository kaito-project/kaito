# Requires the workspace manager to enable the enableCPUInference feature gate.
apiVersion: kaito.sh/v1beta1
kind: InferenceSet
metadata:
  name: gemma-4-e4b-it-cpu-vllm
spec:
  replicas: 1
  labelSelector:
    matchLabels:
      apps: gemma-4-e4b-it-cpu-vllm
  template:
    resource:
      instanceType: Standard_D16s_v6
    inference:
      preset:
        name: google/gemma-4-E4B-it
        presetOptions:
          modelAccessSecret: hf-token
