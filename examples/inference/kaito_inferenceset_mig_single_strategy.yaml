apiVersion: kaito.sh/v1beta1
kind: InferenceSet
metadata:
  annotations:
    scaledobject.kaito.sh/auto-provision: "true"
    scaledobject.kaito.sh/metricName: "vllm:num_requests_waiting"
    scaledobject.kaito.sh/threshold: "10"
  name: phi-4-mini
  namespace: default
spec:
  replicas: 2
  labelSelector:
    matchLabels:
      apps: phi-4-mini
  template:
    metadata:
      labels:
        apps: phi-4-mini
    resource:
      labelSelector:
        matchLabels:
          kaito-inferenceset: phi-4-mini   # target your MIG node(s)
    inference:
      preset:
        accessMode: public
        name: microsoft/Phi-4-mini-instruct