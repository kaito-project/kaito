# DeepSeek-V4-Flash served from weights baked into a custom GPU node image.
#
# Instead of downloading the ~148 GiB of weights from HuggingFace at runtime, the
# GPU nodes in this pool use a custom node image (VHD) that already contains the
# model weights under /opt/kaito/models/deepseek-ai-deepseek-v4-flash (the path is
# derived from the preset name: lowercased, with "/" replaced by "-").
#
# DeepSeek-V4-Flash is FP8 and uses DeepGEMM, which JIT-compiles kernels with nvcc
# at runtime. The slim base image ships no CUDA toolkit, so KAITO provisions one on
# the node automatically for DeepGEMM models: an init container installs
# cuda-toolkit-12-9 into a node directory (default /opt/kaito/cuda/129) when nvcc is
# absent, or reuses a toolkit already baked there. The install lives on the node, so
# it survives pod recreation and is shared by all pods on the node.
#
# Annotation used here:
#   kaito.sh/use-local-weights  - "true" makes KAITO load weights from the node at
#                                 /opt/kaito/models/<sanitized preset name>, mount
#                                 it read-only, and point vLLM at it via --model
#                                 (no HuggingFace download).
#
# This is a BYO-nodes setup: the GPU node pool is pre-provisioned and its nodes are
# labeled so the workspace's labelSelector can target them.
apiVersion: kaito.sh/v1beta1
kind: Workspace
metadata:
  name: workspace-deepseek-v4-flash
  annotations:
    kaito.sh/use-local-weights: "true"
resource:
  count: 1
  labelSelector:
    matchLabels:
      kaito-workspace: deepseek-v4-flash
inference:
  preset:
    name: deepseek-ai/DeepSeek-V4-Flash
