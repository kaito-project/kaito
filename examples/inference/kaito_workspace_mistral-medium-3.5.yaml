# apiVersion: v1
# kind: ConfigMap
# metadata:
#   name: mistral-medium-inference-config
# data:
#   inference_config.yaml: |
#     vllm:
#       # KAITO's max-model-len estimator over-counts available KV cache (it does
#       # not model CUDA-graph memory), yielding 78592 which exceeds the ~56K vLLM
#       # can actually fit on 2x H100 for this 124Gi model. Cap it to fit the KV
#       # budget and avoid the startup ValueError / crash-loop.
#       max-model-len: 49152
# ---
apiVersion: kaito.sh/v1beta1
kind: Workspace
metadata:
  name: workspace-mistral-medium
resource:
  # instanceType: "Standard_NC80adis_H100_v5"
  instanceType: "Standard_NC24ads_A100_v4"
  labelSelector:
    matchLabels:
      apps: mistral-medium
inference:
  preset:
    name: "mistralai/Mistral-Small-4-119B-2603"
    presetOptions:
      modelAccessSecret: hf-secret
  # config: mistral-medium-inference-config # Reference to ConfigMap name

