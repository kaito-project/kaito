apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-guard-policy
data:
  policy.yaml: |
    blockMessage: The model output was blocked by gateway guardrails.
    scanners:
    - type: ban_substrings
      action: block
      substrings:
      - INTERNAL_ONLY
      match_type: word
      case_sensitive: false
    - type: regex
      action: redact
      patterns:
      - DEMO-[0-9]{4}
      match_type: search
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-guard-scanner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-guard-scanner
  template:
    metadata:
      labels:
        app: llm-guard-scanner
    spec:
      containers:
      - name: scanner
        image: llm-guard-scanner:poc
        imagePullPolicy: Never
        env:
        - name: POLICY_PATH
          value: /etc/llm-guard/policy.yaml
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
        volumeMounts:
        - name: policy
          mountPath: /etc/llm-guard
          readOnly: true
      volumes:
      - name: policy
        configMap:
          name: llm-guard-policy
---
apiVersion: v1
kind: Service
metadata:
  name: llm-guard-scanner
spec:
  selector:
    app: llm-guard-scanner
  ports:
  - name: http
    port: 8000
    targetPort: http