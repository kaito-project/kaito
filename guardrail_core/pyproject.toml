[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "kaito-guardrail-core"
version = "0.1.0"
description = "KAITO-owned guardrail scanners and streaming utilities"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "bc-detect-secrets==1.5.43",
    "json-repair==0.60.1",
    "regex==2024.11.6",
    "tiktoken==0.11.0",
]

[project.urls]
Homepage = "https://github.com/kaito-project/kaito"
Source = "https://github.com/kaito-project/kaito/tree/main/guardrail_core"
Issues = "https://github.com/kaito-project/kaito/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["guardrail_core", "guardrail_core.*"]
exclude = ["*.tests", "*.tests.*"]
namespaces = false
