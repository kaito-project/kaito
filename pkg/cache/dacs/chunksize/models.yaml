# Models for which the run:ai streamer chunk size is auto-recommended.
#
# The recommended chunk size (RUNAI_STREAMER_CHUNK_BYTESIZE) is derived offline
# from each model's safetensors tensor layout: the generator reads the
# safetensors header of every shard (exactly how the run:ai streamer does — the
# leading uint64 header length followed by the JSON header whose per-tensor
# `data_offsets` give each tensor's byte size) and recommends the modal
# per-tensor size (the size the most tensors share), capping any tensor above
# 32 MiB at 32 MiB before counting and flooring the result at 2 MiB. Aligning
# the streamer chunk to that size makes the dominant per-tensor read map to a
# single chunk.
#
# KAITO's presets/workspace/models/supported_models.yaml is the source of truth
# for supported presets; this file only lists the (name, repo, revision) needed
# to fetch tensor metadata for chunk-size recommendation. Models already in
# supported_models.yaml can be listed here too — the point is the HuggingFace
# repo/revision to read headers from.
#
# Pin `revision` to a commit SHA for reproducible generation (the generated Go
# file is checked in; CI does not refetch). Regenerate with:
#
#   make generate-chunksizes
#
models:
  # Not present in supported_models.yaml (which only has qwen2.5-coder-*).
  - name: qwen3-coder-30b-a3b-instruct
