apiVersion: kaito.sh/v1beta1
kind: RAGEngine
metadata:
  name: guardrails-demo
spec:
  inferenceService:
    url: "http://mock-openai.default.svc.cluster.local:8000/v1/chat/completions"
    contextWindowSize: 4000
  embedding:
    remote:
      url: "http://mock-openai.default.svc.cluster.local:8000/v1/embeddings"
  guardrails:
    enabled: true
    configMapRef:
      name: guardrails-demo-policy
